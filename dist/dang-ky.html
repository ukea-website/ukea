<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="icon" type="image/png" href="assets/ukea-favicon.png">
    <meta name="description" content="Đăng ký nhận tư vấn về Oxford Test of English.">
    <title>Đăng ký tư vấn OTE</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="site-header"></div>
    <main id="main">
        <section class="content-hero">
            <div class="eyebrow">ĐĂNG KÝ TƯ VẤN</div>
            <h1>Nhận tư vấn về bài thi OTE</h1>
            <p>Để lại thông tin để đội ngũ tư vấn liên hệ hỗ trợ chọn bài thi và chuẩn bị đăng ký.</p>
        </section>
        <section class="consult" id="form">
            <div>
                <div class="eyebrow">THÔNG TIN HỌC VIÊN</div>
                <h2>Đăng ký nhận tư vấn</h2>
                <p>Thông tin được dùng để liên hệ tư vấn về Oxford Test of English. Bạn có thể yêu cầu cập nhật hoặc xóa
                    dữ liệu đã cung cấp.</p>
            </div>
            <form id="lead-form" class="ukea-form">
                <div class="ukea-field">
                    <input class="ukea-control" id="lead-full-name" name="fullName" required autocomplete="name" placeholder=" " aria-describedby="lead-full-name-error">
                    <label for="lead-full-name">Họ và tên</label>
                    <span class="ukea-field-message" id="lead-full-name-error" aria-live="polite"></span>
                </div>
                <div class="ukea-field">
                    <input class="ukea-control" id="lead-phone" name="phone" required autocomplete="tel" inputmode="tel" placeholder=" " aria-describedby="lead-phone-error">
                    <label for="lead-phone">Số điện thoại</label>
                    <span class="ukea-field-message" id="lead-phone-error" aria-live="polite"></span>
                </div>
                <div class="ukea-field">
                    <input class="ukea-control" id="lead-email" name="email" required type="email" autocomplete="email" placeholder=" " aria-describedby="lead-email-error">
                    <label for="lead-email">Địa chỉ email</label>
                    <span class="ukea-field-message" id="lead-email-error" aria-live="polite"></span>
                </div>
                <div class="ukea-field ukea-field--select">
                    <select class="ukea-control" id="lead-interest" name="interest" aria-describedby="lead-interest-error">
                        <option value="OTE">Oxford Test of English</option>
                        <option value="OTE Advanced">OTE Advanced</option>
                        <option value="Chưa xác định">Chưa xác định</option>
                    </select>
                    <label for="lead-interest">Nhu cầu tư vấn</label>
                    <span class="ukea-field-message" id="lead-interest-error" aria-live="polite"></span>
                </div>
                <div class="ukea-check-field">
                    <label class="ukea-check" for="lead-consent"><input id="lead-consent" name="consent" required type="checkbox" aria-describedby="lead-consent-error"><span>Tôi đồng ý để website lưu thông tin và liên hệ tư vấn về bài thi.</span></label>
                    <span class="ukea-field-message" id="lead-consent-error" aria-live="polite"></span>
                </div>
                <button class="primary" type="submit">Gửi đăng ký →</button>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>
    <div id="site-footer"></div>
    <script src="site-v3.js"></script>
    <script src="nav.js"></script>
    <script src="consult-modal.js"></script>
    <script src="home-locations.js"></script><script src="header-contact.js"></script>
    <script src="lead-form.js"></script>
</body>

</html>
