<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Đăng ký nhận tư vấn về Oxford Test of English."><title>Đăng ký tư vấn OTE</title><link rel="stylesheet" href="styles.css"></head><body><div id="site-header"></div><main id="main"><section class="content-hero"><div class="eyebrow">ĐĂNG KÝ TƯ VẤN</div><h1>Nhận tư vấn về bài thi OTE</h1><p>Để lại thông tin để đội ngũ tư vấn liên hệ hỗ trợ chọn bài thi và chuẩn bị đăng ký.</p></section><section class="consult" id="form"><div><div class="eyebrow">THÔNG TIN HỌC VIÊN</div><h2>Đăng ký nhận tư vấn</h2><p>Thông tin được dùng để liên hệ tư vấn về Oxford Test of English. Bạn có thể yêu cầu cập nhật hoặc xóa dữ liệu đã cung cấp.</p></div><form id="lead-form"><label>Họ và tên<input name="fullName" required autocomplete="name" placeholder="Nhập họ và tên"></label><label>Số điện thoại<input name="phone" required autocomplete="tel" inputmode="tel" placeholder="Nhập số điện thoại"></label><label>Địa chỉ email<input name="email" required type="email" autocomplete="email" placeholder="Nhập email"></label><label>Nhu cầu tư vấn<select name="interest"><option value="OTE">Oxford Test of English</option><option value="OTE Advanced">OTE Advanced</option><option value="Chưa xác định">Chưa xác định</option></select></label><label class="agree"><input name="consent" required type="checkbox"> Tôi đồng ý để website lưu thông tin và liên hệ tư vấn về bài thi.</label><button class="primary" type="submit">Gửi đăng ký →</button><p class="form-message" role="status" aria-live="polite"></p></form></section></main><div id="site-footer"></div><script src="site-v3.js"></script><script src="lead-form.js"></script></body></html>
